<!DOCTYPE html>
<html>
<head>
    <title>Register</title>
</head>
<body>
    <h2>Register</h2>
    {% if messages %}
      {% for message in messages %}
        <p style="color:red;">{{ message }}</p>
      {% endfor %}
    {% endif %}
    <form method="post">
        {% csrf_token %}
        <input type="text" name="username" placeholder="Username" required><br><br>
        <input type="password" name="password" placeholder="Password" required><br><br>
        <input type="password" name="password_confirm" placeholder="Confirm Password" required><br><br>
        <button type="submit">Register</button>
    </form>
    <p>Already have an account? <a href="{% url 'chat:login' %}">Login here</a>.</p>

    <!-- Admin login button -->
    <p><a href="{% url 'admin:login' %}"><button>Admin Login</button></a></p>

</body>
</html>
